        case 6:
          return `
            <div class="space-y-5">
              <div>
                <h2 class="text-3xl sm:text-4xl font-extrabold text-white">Langkah Praktis <span class="text-[#F3C623]">di Lapangan</span></h2>

                </div>
                <div class="glass-card rounded-2xl p-5">
                  <div class="text-3xl font-extrabold text-[#F3C623] font-mono mb-1">03</div>
                  <h3 class="text-base font-bold text-[#F3C623] mb-2">Manajemen Kesalahan</h3>
                  <p class="text-xs text-slate-200 mb-3">Akui kesalahan, fokus perbaikan cepat, hindari menyalahkan rekan.</p>
                  <p class="text-[11px] text-slate-300"><strong class="text-[#F3C623]">Aksi:</strong> Quick damage control saat kendala teknis terjadi.</p>
                </div>
                <div class="glass-card rounded-2xl p-5">
                  <div class="text-3xl font-extrabold text-[#F3C623] font-mono mb-1">04</div>
                  <h3 class="text-base font-bold text-[#F3C623] mb-2">Kerjasama Tim</h3>
                  <p class="text-xs text-slate-200 mb-3">Bersatu, saling melengkapi, dan bergerak bersama mencapai target.</p>

              <button onclick="openModal('unicef-toolkits')" class="w-full glass-card rounded-2xl p-4 px-6 flex items-center justify-between text-left cursor-pointer">
                <span class="text-sm font-bold text-[#F3C623]">Baca Detail: UNICEF Life Skills &amp; Community Engagement Toolkits</span>
                <i data-lucide="book-open" class="w-4 h-4 text-[#F3C623]"></i>

        case 7:
          return `
            <div class="space-y-6">
              <div>
                <h2 class="text-3xl sm:text-4xl font-extrabold text-white">Aktivitas <span class="text-[#F3C623]">Interaktif Sesi</span></h2>
                <p class="text-sm text-slate-200 mt-1">Menerjemahkan teori kepemimpinan menjadi pemahaman dan aksi nyata.</p>
              </div>
              <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="glass-card rounded-2xl p-7 flex flex-col justify-between">
                  <div>
                    <span class="px-4 py-1 rounded-lg bg-[#F3C623] text-[#0B192C] text-xs font-extrabold">Sesi 1 - 10 Menit</span>

                      Tulis di buku: (1) Satu kelebihan yang paling sering dihargai teman, (2) Satu ketakutan terbesar saat memegang tanggung jawab, dan cara mengatasinya.
                    </p>
                  </div>
                  <button onclick="openTimerModal(10, 'Sesi 1: Refleksi Diri (Muhasabah)', 'Mengenali kelebihan unik dan menaklukkan rasa takut memimpin.')" class="w-full py-3 rounded-xl bg-gradient-to-r from-[#D4AF37] to-[#F3C623] text-[#0B192C] font-extrabold text-sm cursor-pointer">
                    Buka Timer 10 Menit Interaktif
                  </button>
                </div>
                <div class="glass-card rounded-2xl p-7 flex flex-col justify-between">
                  <div>
                    <span class="px-4 py-1 rounded-lg bg-[#F3C623] text-[#0B192C] text-xs font-extrabold">Sesi 2 - 15 Menit</span>
                    <h3 class="text-2xl font-extrabold text-white mt-4 mb-2">Studi Kasus Lapangan</h3>
                    <p class="text-sm text-slate-200 mb-4">Problem solving cepat berlandaskan karakter Shiddiq, Amanah, Fathanah, Tabligh.</p>
                    <p class="text-xs text-slate-300 bg-[#0B192C]/70 p-4 rounded-xl mb-6">
                      "Dua hari jelang event, anggaran berkurang 50% dan koordinasi antar-divisi macet. Rumuskan 3 langkah konkret pemecahan masalah dalam tim!"

                    <button onclick="openTimerModal(15, 'Sesi 2: Studi Kasus Lapangan', 'Rumuskan 3 langkah konkret pemecahan masalah dalam tim!')" class="py-3 rounded-xl bg-gradient-to-r from-[#D4AF37] to-[#F3C623] text-[#0B192C] font-extrabold text-xs sm:text-sm cursor-pointer">
                      Buka Timer 15 Menit
                    </button>
                    <button onclick="openModal('panduan-studi-kasus')" class="py-3 rounded-xl border border-[#D4AF37] text-[#F3C623] font-bold text-xs sm:text-sm cursor-pointer">

        case 8:
          return `
            <div class="space-y-6 max-w-3xl">
              <h2 class="text-3xl sm:text-5xl font-extrabold text-white leading-tight">
                Memimpin dengan Hati,<br /><span class="text-[#F3C623]">Menjadi Teladan Sejati</span>
              </h2>
              <blockquote class="text-base sm:text-xl text-slate-200 italic">
                “Jadilah pemimpin yang menginspirasi, membawa kebaikan di mana pun berada, dan meninggalkan jejak kebaikan abadi.”
              </blockquote>
              <div class="glass-card rounded-2xl p-6 space-y-4">
                <h3 class="text-lg font-extrabold text-[#F3C623] uppercase">RUANG DISKUSI &amp; TANYA JAWAB</h3>
                <p class="text-sm text-slate-200">Kami membuka ruang interaksi. Silakan ajukan pertanyaan, bagikan tantangan di kepengurusan, atau sampaikan gagasan terbaik Anda.</p>
                <button onclick="openFaqModal()" class="px-5 py-3 rounded-xl bg-gradient-to-r from-[#D4AF37] to-[#F3C623] text-[#0B192C] font-extrabold text-xs sm:text-sm cursor-pointer">
                  FAQ / Pertanyaan Umum Seputar Kepemimpinan OSIS
                </button>
              </div>
            </div>
          `;
      }
    }

    function renderSlide() {
      const container = document.getElementById('slide-container');
      container.classList.remove('slide-enter');
      void container.offsetWidth;
      container.innerHTML = getSlideHTML(currentSlide);
      container.classList.add('slide-enter');

      document.getElementById('slide-counter-text').textContent = `Slide ${currentSlide + 1} dari ${totalSlides}`;
      document.getElementById('btn-prev').disabled = currentSlide === 0;
      document.getElementById('btn-next').disabled = currentSlide === totalSlides - 1;

      const dotsContainer = document.getElementById('dot-indicators');
      dotsContainer.innerHTML = Array.from({ length: totalSlides }).map((_, idx) => `
        <button onclick="goToSlide(${idx})" class="h-2.5 rounded-full transition-all cursor-pointer ${idx === currentSlide ? 'w-8 bg-[#F3C623]' : 'w-2.5 bg-slate-600'}"></button>
      `).join('');

      lucide.createIcons();
    }

    function goToSlide(index) {
      if (index >= 0 && index < totalSlides) {
        currentSlide = index;
        renderSlide();
      }
    }
    function nextSlide() { if (currentSlide < totalSlides - 1) { currentSlide++; renderSlide(); } }
    function prevSlide() { if (currentSlide > 0) { currentSlide--; renderSlide(); } }

    function openModal(key) {
      stopTimer();
      const item = MODAL_DATA[key];
      if (!item) return;
      const backdrop = document.getElementById('modal-backdrop');
      const content = document.getElementById('modal-content');
      content.innerHTML = `
        <div class="flex items-start justify-between gap-4 mb-4">
          <span class="text-xs font-bold uppercase tracking-wider text-[#F3C623]">${item.badge}</span>
          <button onclick="closeModal()" class="p-1.5 rounded-lg border border-slate-700 text-slate-400 hover:text-white cursor-pointer"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <h3 class="text-xl sm:text-2xl font-extrabold text-white mb-1.5">${item.title}</h3>
        <p class="text-xs sm:text-sm text-slate-300 mb-5">${item.subtitle}</p>
        ${item.arabic ? `
          <div class="p-5 rounded-2xl bg-[#07111E]/90 border border-[#D4AF37]/40 mb-5 space-y-3">
            <p dir="rtl" class="font-arabic text-2xl sm:text-3xl text-[#F3C623] text-right leading-loose">${item.arabic}</p>
            <p class="text-xs text-slate-300 italic">${item.latin}</p>
            <p class="text-xs sm:text-sm text-slate-100 font-medium">${item.translation}</p>
          </div>
        ` : ''}
        <div class="space-y-2.5 mb-5">
          <h4 class="text-sm font-bold text-[#F3C623] uppercase">${item.reflectionTitle}</h4>
          <ul class="space-y-2">
            ${item.points.map(pt => `<li class="text-xs sm:text-sm text-slate-200 flex items-start gap-2"><span class="text-[#F3C623]">◇</span><span>${pt}</span></li>`).join('')}
          </ul>
        </div>
        <div class="p-4 rounded-xl bg-[#D4AF37]/15 border border-[#D4AF37]/50 text-xs sm:text-sm text-slate-100">
          <strong class="text-[#F3C623]">Intisari Aksi:</strong> ${item.takeaway}
        </div>
      `;
      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');
      lucide.createIcons();
    }

    function openFaqModal() {
      stopTimer();
      const backdrop = document.getElementById('modal-backdrop');
      const content = document.getElementById('modal-content');
      content.innerHTML = `
        <div class="flex items-start justify-between gap-4 mb-4">
          <span class="text-xs font-bold uppercase tracking-wider text-[#F3C623]">FAQ Kepemimpinan OSIS</span>
          <button onclick="closeModal()" class="p-1.5 rounded-lg border border-slate-700 text-slate-400 hover:text-white cursor-pointer"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <h3 class="text-xl sm:text-2xl font-extrabold text-white mb-4">3 Pertanyaan Tersering Seputar Kepemimpinan OSIS</h3>
        <div class="space-y-4">
          ${FAQ_LIST.map(item => `
            <div class="p-4 rounded-xl bg-[#07111E]/85 border border-[#D4AF37]/35 space-y-2">
              <h4 class="text-sm font-bold text-[#F3C623]">${item.q}</h4>
              <p class="text-xs sm:text-sm text-slate-200 leading-relaxed">${item.a}</p>
            </div>
          `).join('')}
        </div>
      `;
      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');
      lucide.createIcons();
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = (sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function openTimerModal(minutes, title, promptText) {
      stopTimer();
      timerRemainingSeconds = minutes * 60;
      const backdrop = document.getElementById('modal-backdrop');
      const content = document.getElementById('modal-content');
      content.innerHTML = `
        <div class="flex items-start justify-between gap-4 mb-4">
          <span class="text-xs font-bold uppercase tracking-wider text-[#F3C623]">Countdown Timer Sesi Interaktif</span>
          <button onclick="closeModal()" class="p-1.5 rounded-lg border border-slate-700 text-slate-400 hover:text-white cursor-pointer"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <h3 class="text-xl font-extrabold text-white mb-2">${title}</h3>
        <p class="text-xs sm:text-sm text-slate-300 mb-6">${promptText}</p>
        <div class="py-8 rounded-2xl bg-[#07111E]/90 border border-[#D4AF37]/50 text-center mb-6">
          <div id="timer-display" class="text-6xl font-extrabold font-mono text-[#F3C623] mb-2">${formatTime(timerRemainingSeconds)}</div>
          <p id="timer-status" class="text-xs text-slate-400">Siap dimulai</p>
        </div>
        <div class="flex items-center justify-center gap-3">
          <button onclick="toggleTimer()" id="timer-toggle-btn" class="px-6 py-2.5 rounded-xl bg-gradient-to-r from-[#D4AF37] to-[#F3C623] text-[#0B192C] font-extrabold text-sm cursor-pointer">Mulai Timer</button>
          <button onclick="resetTimer(${minutes})" class="px-4 py-2.5 rounded-xl border border-[#D4AF37]/50 text-xs font-bold text-slate-200 cursor-pointer">Reset</button>
        </div>
      `;
      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');
      lucide.createIcons();
    }

    function toggleTimer() {
      const btn = document.getElementById('timer-toggle-btn');
      const status = document.getElementById('timer-status');
      if (timerRunning) {
        stopTimer();
        if (btn) btn.textContent = 'Lanjutkan';
        if (status) status.textContent = 'Timer dijeda';
      } else {
        timerRunning = true;
        if (btn) btn.textContent = 'Jeda Timer';
        if (status) status.textContent = 'Sesi sedang berlangsung...';
        timerInterval = setInterval(() => {
          if (timerRemainingSeconds > 0) {
            timerRemainingSeconds--;
            const disp = document.getElementById('timer-display');
            if (disp) disp.textContent = formatTime(timerRemainingSeconds);
          } else {
            stopTimer();
            const statusEl = document.getElementById('timer-status');
            if (statusEl) statusEl.textContent = 'Waktu Habis!';
          }
        }, 1000);
      }
    }

    function stopTimer() {
      timerRunning = false;
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    }

    function resetTimer(minutes) {
      stopTimer();
      timerRemainingSeconds = minutes * 60;
      const disp = document.getElementById('timer-display');
      const btn = document.getElementById('timer-toggle-btn');
      if (disp) disp.textContent = formatTime(timerRemainingSeconds);
      if (btn) btn.textContent = 'Mulai Timer';
    }

    function closeModal() {
      stopTimer();
      const backdrop = document.getElementById('modal-backdrop');
      backdrop.classList.add('hidden');
      backdrop.classList.remove('flex');
    }

    function handleBackdropClick(e) {
      if (e.target.id === 'modal-backdrop') closeModal();
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    window.addEventListener('keydown', (e) => {
      const modalOpen = !document.getElementById('modal-backdrop').classList.contains('hidden');
      if (e.key === 'Escape' && modalOpen) { closeModal(); return; }
      if (!modalOpen) {
        if (e.key === 'ArrowRight') nextSlide();
        if (e.key === 'ArrowLeft') prevSlide();
      }
    });

    renderSlide();
  </script>
</body>
